[package]
name = "itinera"
version = "0.1.0"
description = "Itinera desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "itinera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
tauri-plugin-http = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
